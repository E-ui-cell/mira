name: PowerShell 5.1 syntax

on:
  push:
  pull_request:

jobs:
  syntax:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Parse mira.ps1 with Windows PowerShell 5.1
        shell: powershell
        run: .\tests\Test-ScriptSyntax.ps1 -ScriptPath .\mira.ps1

      - name: Parse gemma.ps1 with Windows PowerShell 5.1
        shell: powershell
        run: .\tests\Test-ScriptSyntax.ps1 -ScriptPath .\gemma\gemma.ps1

      - name: Parse Gemma UI modules with Windows PowerShell 5.1
        shell: powershell
        run: .\tests\Test-ScriptSyntax.ps1 -ScriptPath .\gemma\ui

      - name: Parse Gemma desktop GUI modules with Windows PowerShell 5.1
        shell: powershell
        run: .\tests\Test-ScriptSyntax.ps1 -ScriptPath .\gemma\gui

      - name: Parse preserved Gemma CLI entry point with Windows PowerShell 5.1
        shell: powershell
        run: .\tests\Test-ScriptSyntax.ps1 -ScriptPath .\gemma\gemma-cli.ps1

      - name: Parse Gemma provider modules with Windows PowerShell 5.1
        shell: powershell
        run: .\tests\Test-ScriptSyntax.ps1 -ScriptPath .\gemma\providers

      - name: Parse Gemma configuration with Windows PowerShell 5.1
        shell: powershell
        run: .\tests\Test-ScriptSyntax.ps1 -ScriptPath .\gemma\config

      - name: Parse Gemma agent modules with Windows PowerShell 5.1
        shell: powershell
        run: .\tests\Test-ScriptSyntax.ps1 -ScriptPath .\gemma\agent

      - name: Parse Gemma native Windows modules with Windows PowerShell 5.1
        shell: powershell
        run: .\tests\Test-ScriptSyntax.ps1 -ScriptPath .\gemma\windows

      - name: Load Gemma components in Windows PowerShell 5.1
        shell: powershell
        run: .\tests\Test-GemmaModules.ps1

      - name: Parse SearchPreflight backup with Windows PowerShell 5.1
        shell: powershell
        run: .\tests\Test-ScriptSyntax.ps1 -ScriptPath .\backups\gemma-SearchPreflight.ps1
