name: PowerShell compatibility (5.1 + 7)

on:
  push:
  pull_request:

jobs:
  windows-powershell-51:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Parse mira.ps1 with Windows PowerShell 5.1
        shell: powershell
        run: .\tests\Test-ScriptSyntax.ps1 -ScriptPath .\mira.ps1

      - name: Parse gemma.ps1 with Windows PowerShell 5.1
        shell: powershell
        run: .\tests\Test-ScriptSyntax.ps1 -ScriptPath .\gemma\gemma.ps1

      - name: Test GPT-only implementation with Windows PowerShell 5.1
        shell: powershell
        run: .\tests\Test-GptOAuth.ps1 -ScriptPath .\gemma\gemma.ps1

  powershell-7:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Parse mira.ps1 with PowerShell 7
        shell: pwsh
        run: ./tests/Test-ScriptSyntax.ps1 -ScriptPath ./mira.ps1

      - name: Parse gemma.ps1 with PowerShell 7
        shell: pwsh
        run: ./tests/Test-ScriptSyntax.ps1 -ScriptPath ./gemma/gemma.ps1

      - name: Test GPT-only implementation with PowerShell 7
        shell: pwsh
        run: ./tests/Test-GptOAuth.ps1 -ScriptPath ./gemma/gemma.ps1
