name: MIRA Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate with Windows PowerShell 5.1
        shell: powershell
        run: .\tests\Test-ScriptSyntax.ps1 -ScriptPath .\mira.ps1

      - name: Prepare release package
        shell: powershell
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = $env:RELEASE_TAG.Trim()
          if (-not $tag.StartsWith('v')) { throw 'Release tag must start with v.' }
          $version = $tag.Substring(1)
          if ($version -notmatch '^\d+\.\d+\.\d+(?:[-+][0-9A-Za-z.-]+)?$') { throw 'Release tag must look like v1.2.3 or v1.2.3-beta.1.' }
          $dist = Join-Path $env:GITHUB_WORKSPACE 'dist'
          $stage = Join-Path $dist 'mira'
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item .\mira.ps1 $stage\mira.ps1 -Force
          Copy-Item .\README.md $stage\README.md -Force
          $zip = Join-Path $dist ('mira_' + $tag + '.zip')
          Compress-Archive -Path (Join-Path $stage '*') -DestinationPath $zip -CompressionLevel Optimal
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -Path (Join-Path $dist 'SHA256SUMS.txt') -Value ($hash + '  ' + (Split-Path -Leaf $zip)) -Encoding UTF8

      - name: Verify release package
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $dist = Join-Path $env:GITHUB_WORKSPACE 'dist'
          $zip = Get-ChildItem $dist -Filter 'mira_v*.zip' | Select-Object -First 1
          if ($null -eq $zip) { throw 'Release ZIP was not created.' }
          $verify = Join-Path $env:RUNNER_TEMP 'mira-release-verify'
          if (Test-Path $verify) { Remove-Item $verify -Recurse -Force }
          Expand-Archive -Path $zip.FullName -DestinationPath $verify -Force
          if (-not (Test-Path (Join-Path $verify 'mira.ps1'))) { throw 'mira.ps1 missing from release ZIP.' }
          if (-not (Test-Path (Join-Path $verify 'README.md'))) { throw 'README.md missing from release ZIP.' }
          $expected = (Get-FileHash $zip.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          $line = Get-Content (Join-Path $dist 'SHA256SUMS.txt') | Select-Object -First 1
          if (-not $line.StartsWith($expected + '  ')) { throw 'SHA256SUMS.txt does not match the release ZIP.' }

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          name: MIRA ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/mira_${{ github.ref_name }}.zip
            dist/SHA256SUMS.txt
            mira.ps1
